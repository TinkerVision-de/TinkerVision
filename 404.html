<!DOCTYPE html>
<html lang="de">
<head>
  <script>(function(){var t;try{t=localStorage.getItem("tv-theme")}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – TinkerVision</title>
  <meta name="theme-color" content="#ececf1">
  <link rel="stylesheet" href="/site.css">
  <link rel="preload" href="/fonts/outfit-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/orbitron-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { --accent: #822ef5; }
    body { font-family:Outfit,system-ui,sans-serif; color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; background:var(--bg0); background-image:radial-gradient(ellipse 70% 45% at 50% 0%, var(--glow) 0%, transparent 70%), linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:auto,28px 28px,28px 28px; }
    .top { width:min(560px, calc(100% - 28px)); display:flex; justify-content:space-between; align-items:center; padding:16px 0 0; }
    .back { color:var(--muted); text-decoration:none; font-size:.88rem; }
    .lang button { font-family:Outfit,sans-serif; font-size:.7rem; letter-spacing:.1em; font-weight:600; border:0; background:transparent; color:var(--muted); padding:7px 12px; cursor:pointer; }

    main { width:min(560px, calc(100% - 28px)); margin:14px auto 28px; background:var(--card); border:1px solid var(--card-border); border-radius:28px; padding:28px 22px 22px; box-shadow:0 24px 50px var(--shadow); }
    @media (min-width:900px) { .top, main { width:min(680px, calc(100% - 48px)); } }
    .brand { font-family:Orbitron,sans-serif; font-size:1.5rem; letter-spacing:.24em; font-weight:700; margin:0 0 10px; text-align:center; }
    h1 { font-family:Orbitron,sans-serif; font-size:.95rem; letter-spacing:.12em; margin:0; text-align:center; }
    .rule { width:28px; height:2px; background:var(--ink); margin:14px auto 18px; opacity:.22; border-radius:2px; }
    .lead { color:var(--muted); text-align:center; margin:0 0 14px; font-size:.95rem; }
    a.item { display:grid; grid-template-columns:72px 1fr 16px; gap:14px; align-items:center; text-decoration:none; color:var(--ink); background:var(--card-solid); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:16px; padding:14px; }
    a.item:hover { transform:translateY(-2px); }
    .thumb { width:72px; height:72px; border-radius:12px; background:var(--card-solid); border:1px solid var(--line); display:grid; place-items:center; }
    strong { display:block; font-size:1rem; }
    span { display:block; color:var(--muted); font-size:.8rem; margin-top:3px; }
    footer { margin-top:auto; padding:8px 16px 28px; color:var(--muted); font-size:.75rem; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

    .logo { width:120px; height:120px; display:block; margin:0 auto 14px; }
    .code { font-family:Orbitron,sans-serif; font-size:3rem; letter-spacing:.2em; text-align:center; margin:0; color:var(--accent); }
    .home { display:block; width:max-content; margin:6px auto 0; background:var(--ink); color:var(--card-solid); text-decoration:none; border-radius:999px; padding:12px 22px; font-weight:600; }
  
  </style>
</head>
<body>
  <div class="top">
    <a class="back" href="/" data-i18n="back">← Startseite</a>
    <div class="tools">
      <label class="ios-switch"><input type="checkbox" data-theme-toggle aria-label="Dunkles Design umschalten"><span class="ios-slider"></span></label>
      <div class="lang">
        <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
  <main>
    <img class="logo" src="/logo.webp" alt="TinkerVision" width="120" height="120">
    <p class="code">404</p>
    <h1 data-i18n="title">Seite nicht gefunden</h1>
    <div class="rule"></div>
    <p class="lead" data-i18n="lead">Diese Seite gibt es nicht (mehr). Vielleicht hat sich ein Tippfehler eingeschlichen.</p>
    <a class="home" href="/" data-i18n="home">Zur Startseite</a>
  </main>
  <footer>
    <span>© 2026 TinkerVision</span>
    <a href="/impressum.html" data-i18n="imprint">Impressum</a>
    <a href="/datenschutz.html" data-i18n="privacy">Datenschutz</a>
    <a href="/agb.html" data-i18n="agb">AGB</a>
    <a href="/widerruf.html" data-i18n="widerruf">Widerruf</a>
  </footer>
  <script src="/site.js"></script>
  <script>
    const T = {
      de: { back:"← Startseite", title:"Seite nicht gefunden", lead:"Diese Seite gibt es nicht (mehr). Vielleicht hat sich ein Tippfehler eingeschlichen.", home:"Zur Startseite", imprint:"Impressum", privacy:"Datenschutz", agb:"AGB", widerruf:"Widerruf" },
      en: { back:"← Home", title:"Page not found", lead:"This page doesn't exist (anymore). Maybe there's a typo in the address.", home:"Back to home", imprint:"Imprint", privacy:"Privacy", agb:"Terms", widerruf:"Withdrawal" }
    };
    function applyLang(lang) {
      TV.setLang(T, lang);
    }
    applyLang(TV.startLang());
    document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => applyLang(b.getAttribute("data-set-lang"))));
  </script>
</body>
</html>
