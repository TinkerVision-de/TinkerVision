name: download stats
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Summe schreiben
        env:
          CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
        run: python3 update-downloads.py
      - name: stats.json committen
        run: |
          git config user.name "tinkervision-bot"
          git config user.email "actions@github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Update download stats"
          git push
